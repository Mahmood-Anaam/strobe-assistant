- type: ECR repository
  arn: arn:aws:ecr:ap-southeast-2:901444280953:repository/n11553758-strobe-mcp
  description: Stores the Strobe mcp container image.
- type: Bedrock model
  arn: amazon.titan-embed-text-v2:0
  description: Creates 1024-dimensional semantic-search embeddings.
- type: Bedrock model
  arn: apac.amazon.nova-lite-v1:0
  description: Generates grounded chat, photo descriptions, and retrospectives when
    account policy permits.
