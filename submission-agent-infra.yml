- type: SQS queue
  arn: arn:aws:sqs:ap-southeast-2:901444280953:n11553758-strobe-classification
  description: Buffers S3 photo-created events for asynchronous classification.
- type: SQS dead-letter queue
  arn: arn:aws:sqs:ap-southeast-2:901444280953:n11553758-strobe-classification-dlq
  description: Retains repeatedly failed classification messages for investigation.
- type: EventBridge rule
  arn: arn:aws:events:ap-southeast-2:901444280953:rule/n11553758-strobe-photo-uploaded
  description: Routes new Strobe media objects to the classification queue.
- type: EventBridge rule
  arn: arn:aws:events:ap-southeast-2:901444280953:rule/n11553758-strobe-daily-heartbeat
  description: Runs the autonomous daily retrospective heartbeat.
- type: Secrets Manager secret
  arn: arn:aws:secretsmanager:ap-southeast-2:901444280953:secret:n11553758-strobe/mcp-api-key-jDobpH
