- type: DynamoDB table
  arn: arn:aws:dynamodb:ap-southeast-2:901444280953:table/n11553758-strobe-classifications
  description: Persists Strobe Assistant classification records.
- type: DynamoDB table
  arn: arn:aws:dynamodb:ap-southeast-2:901444280953:table/n11553758-strobe-agent-runs
  description: Persists Strobe Assistant agent-run records.
- type: DynamoDB table
  arn: arn:aws:dynamodb:ap-southeast-2:901444280953:table/n11553758-strobe-idempotency
