[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strobe-assistant"
version = "1.0.0"
description = "Cloud-native AI assistant for the Strobe photo platform"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.40.0",
  "fastapi>=0.115.0",
  "mcp>=1.15.0,<2.0.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "moto[dynamodb,s3,sqs]>=5.1.0",
  "pytest>=8.4.0",
  "pytest-cov>=6.2.0",
  "ruff>=0.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/strobe_assistant"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["docs/strobe"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers -ra"
